<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cork-Board Mermaid Exploder</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #2a2a2a;
    color: #eee;
  }
  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; height: 48px;
    background: #1a1a1a; border-bottom: 1px solid #444;
    display: flex; align-items: center; gap: 8px; padding: 0 16px;
    z-index: 1000; user-select: none;
  }
  #toolbar button {
    background: #333; color: #eee; border: 1px solid #555;
    border-radius: 6px; padding: 6px 14px; cursor: pointer;
    font-size: 14px; transition: background 0.15s;
  }
  #toolbar button:hover { background: #444; }
  #toolbar button:active { background: #555; }
  #status {
    margin-left: auto; font-size: 13px; color: #aaa;

  #viewport {
    position: fixed; top: 48px; left: 0; right: 0; bottom: 0;

    background-size: 24px 24px;

  #viewport.grabbing { cursor: grabbing; }

    position: absolute; top: 0; left: 0;
    transform-origin: 0 0;
    will-change: transform;
  }
  #connections {
    position: absolute; top: 0; left: 0; pointer-events: none;
    overflow: visible;
  }

    box-shadow: 0 8px 32px rgba(0,0,0,0.5);

    flex: 1; min-height: 300px;
    background: #1a1a1a; color: #ddd;
    border: none; outline: none; padding: 14px 18px;

    resize: none; line-height: 1.5;
  }
  #modal-footer {
    padding: 12px 18px; border-top: 1px solid #444;
    display: flex; justify-content: flex-end; gap: 10px;
  }

    background: #444; color: #eee; border: 1px solid #666;

  }
  #modal-footer button.primary { background: #2b6cb0; border-color: #2b6cb0; }
  #modal-footer button:hover { filter: brightness(1.15); }

<body>

<div id="viewport">

<div id="zoom-indicator">100%</div>

<div id="modal-overlay">

<script type="module">
import mermaid from 'https://esm.sh/mermaid@11';

mermaid.initialize({ startOnLoad: false, theme: 'base', useMaxWidth: false });

// ===== STATE =====
const state = {
  pins: [],
  connections: [],
  camera: { x: 0, y: 0, zoom: 1 },
  dragging: null,
  dragOffset: { x: 0, y: 0 },
  panning: false,
  panStart: { x: 0, y: 0 },
  cameraStart: { x: 0, y: 0 },
  nextPinId: 1,
  classDefs: {},
};

// ===== DOM REFS =====
const viewport = document.getElementById('viewport');
const world = document.getElementById('world');
const connectionsSvg = document.getElementById('connections');
const statusEl = document.getElementById('status');
const zoomInd = document.getElementById('zoom-indicator');
const modalOverlay = document.getElementById('modal-overlay');
const mermaidInput = document.getElementById('mermaid-input');

// ===== CAMERA / VIEWPORT =====
function updateCamera() {
  world.style.transform = `translate(${state.camera.x}px, ${state.camera.y}px) scale(${state.camera.zoom})`;
  zoomInd.textContent = Math.round(state.camera.zoom * 100) + '%';
  renderConnections();
}

function screenToWorld(sx, sy) {
  return {
    x: (sx - state.camera.x) / state.camera.zoom,
    y: (sy - state.camera.y) / state.camera.zoom
  };
}

// ===== PIN MANAGEMENT =====
function createPin(x, y, text, style = {}, shape = 'rect') {
  const id = 'pin-' + state.nextPinId++;
  const pin = document.createElement('div');
  pin.className = 'pin';
  pin.id = id;
  pin.style.left = x + 'px';
  pin.style.top = y + 'px';

  const bg = style.fill || '#fff9c4';
  const stroke = style.stroke || '#333';
  const strokeWidth = style.strokeWidth || '1px';
  pin.style.background = bg;
  pin.style.border = `${strokeWidth} solid ${stroke}`;

  if (shape === 'circle') {
    pin.style.borderRadius = '50%';
    pin.style.aspectRatio = '1 / 1';
    pin.style.display = 'flex';
    pin.style.alignItems = 'center';
    pin.style.justifyContent = 'center';
    pin.style.textAlign = 'center';
  } else if (shape === 'rounded') {
    pin.style.borderRadius = '20px';
  } else if (shape === 'diamond') {
    pin.style.transform = 'rotate(45deg)';
    pin.dataset.diamond = 'true';
  }

  const content = document.createElement('div');
  content.className = 'pin-content';
  content.contentEditable = true;
  content.textContent = text;
  if (shape === 'diamond') {
    content.style.transform = 'rotate(-45deg)';
  }
  pin.appendChild(content);

  const indicator = document.createElement('span');
  indicator.className = 'pin-shape-indicator';
  indicator.textContent = shape === 'circle' ? '(())' : shape === 'rounded' ? '()' : shape === 'diamond' ? '{}' : '[]';
  pin.appendChild(indicator);

  world.appendChild(pin);

  const pinObj = { id, el: pin, x, y, text, shape, style, width: 0, height: 0 };
  state.pins.push(pinObj);

  // Measure after render
  requestAnimationFrame(() => {
    const rect = pin.getBoundingClientRect();
    pinObj.width = rect.width / state.camera.zoom;
    pinObj.height = rect.height / state.camera.zoom;
    renderConnections();
  });

  // Drag handlers
  pin.addEventListener('mousedown', (e) => {
    if (e.target.isContentEditable) return;
    e.stopPropagation();
    state.dragging = pinObj;
    const w = screenToWorld(e.clientX, e.clientY);
    state.dragOffset.x = w.x - pinObj.x;
    state.dragOffset.y = w.y - pinObj.y;
    pin.classList.add('dragging');
  });

  content.addEventListener('mousedown', (e) => {
    e.stopPropagation();
  });

  return pinObj;
}

function clearAll() {
  state.pins.forEach(p => p.el.remove());
  state.pins = [];
  state.connections = [];
  renderConnections();
  setStatus('Canvas cleared');
}

// ===== CONNECTIONS =====
function addConnection(fromId, toId, label = '') {
  state.connections.push({ from: fromId, to: toId, label });
  renderConnections();
}

function renderConnections() {
  const svg = connectionsSvg;
  svg.innerHTML = '';
  if (state.connections.length === 0) return;

  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
  marker.setAttribute('id', 'arrowhead');
  marker.setAttribute('markerWidth', '10');
  marker.setAttribute('markerHeight', '7');
  marker.setAttribute('refX', '9');
  marker.setAttribute('refY', '3.5');
  marker.setAttribute('orient', 'auto');
  const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
  polygon.setAttribute('points', '0 0, 10 3.5, 0 7');
  polygon.setAttribute('fill', '#c0392b');
  marker.appendChild(polygon);
  defs.appendChild(marker);
  svg.appendChild(defs);

  state.connections.forEach(conn => {
    const fromPin = state.pins.find(p => p.id === conn.from);
    const toPin = state.pins.find(p => p.id === conn.to);
    if (!fromPin || !toPin) return;

    const fx = fromPin.x + fromPin.width / 2;
    const fy = fromPin.y + fromPin.height / 2;
    const tx = toPin.x + toPin.width / 2;
    const ty = toPin.y + toPin.height / 2;

    const dx = tx - fx;
    const dy = ty - fy;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    const nx = dx / dist;
    const ny = dy / dist;

    const hw = fromPin.width / 2;
    const hh = fromPin.height / 2;
    const tw = toPin.width / 2;
    const th = toPin.height / 2;

    const sx = fx + nx * Math.min(hw * Math.abs(dist/dx) || hw, hw * 1.5);
    const sy = fy + ny * Math.min(hh * Math.abs(dist/dy) || hh, hh * 1.5);
    const ex = tx - nx * Math.min(tw * Math.abs(dist/dx) || tw, tw * 1.5);
    const ey = ty - ny * Math.min(th * Math.abs(dist/dy) || th, th * 1.5);

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M ${sx} ${sy} L ${ex} ${ey}`);
    path.setAttribute('stroke', '#c0392b');
    path.setAttribute('stroke-width', '2');
    path.setAttribute('fill', 'none');
    path.setAttribute('marker-end', 'url(#arrowhead)');
    svg.appendChild(path);

    if (conn.label) {
      const midX = (sx + ex) / 2;
      const midY = (sy + ey) / 2;
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', midX);
      text.setAttribute('y', midY - 4);
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('fill', '#ddd');
      text.setAttribute('font-size', '11');
      text.setAttribute('font-family', 'Segoe UI, sans-serif');
      text.setAttribute('paint-order', 'stroke');
      text.setAttribute('stroke', '#222');
      text.setAttribute('stroke-width', '3');
      text.textContent = conn.label;
      svg.appendChild(text);
    }
  });
}

// ===== MERMAID PARSING =====
function parseMermaid(code) {
  const lines = code.split('\n');
  const nodes = [];
  const edges = [];
  const classDefs = {};

  const nodeRegex = /^(\s*)([A-Za-z0-9_]+)(\[.*?\]|\(.*?\)|\{.*?\}|\(\(.*?\)\))(\s*:::\s*([A-Za-z0-9_]+))?\s*$/;
  const edgeRegex = /^(\s*)([A-Za-z0-9_]+)\s*(-->|-\.->|---|==>)\s*\|?([^|]*)\|?\s*([A-Za-z0-9_]+)\s*$/;
  const classDefRegex = /classDef\s+([A-Za-z0-9_]+)\s+(.+)/;

  lines.forEach(line => {
    line = line.trim();
    if (!line || line.startsWith('graph') || line.startsWith('flowchart')) return;

    const cdMatch = line.match(classDefRegex);
    if (cdMatch) {
      classDefs[cdMatch[1]] = parseStyleString(cdMatch[2]);
      return;
    }

    const edgeMatch = line.match(edgeRegex);
    if (edgeMatch) {
      edges.push({ from: edgeMatch[2], to: edgeMatch[5], label: edgeMatch[4].trim() });
      return;
    }

    const nodeMatch = line.match(nodeRegex);
    if (nodeMatch) {
      const id = nodeMatch[2];
      const shapeStr = nodeMatch[3];
      const className = nodeMatch[5] || null;
      let label = shapeStr.slice(1, -1);
      let shape = 'rect';

      if (shapeStr.startsWith('((') && shapeStr.endsWith('))')) {
        shape = 'circle';
        label = shapeStr.slice(2, -2);
      } else if (shapeStr.startsWith('(') && shapeStr.endsWith(')')) {
        shape = 'rounded';
      } else if (shapeStr.startsWith('{') && shapeStr.endsWith('}')) {
        shape = 'diamond';
      }

      nodes.push({ id, label, shape, className });
    }
  });

  return { nodes, edges, classDefs };
}

function parseStyleString(str) {
  const styles = {};
  str.split(',').forEach(part => {
    const [key, val] = part.split(':');
    if (key && val) {
      const k = key.trim();
      const v = val.trim();
      if (k === 'fill') styles.fill = v;
      if (k === 'stroke') styles.stroke = v;
      if (k === 'stroke-width') styles.strokeWidth = v;
    }
  });
  return styles;
}

// ===== HIERARCHICAL LAYOUT (pure JS, no SVG extraction) =====
function computeLayout(nodes, edges) {
  const nodeIds = new Set(nodes.map(n => n.id));
  const children = {};
  const parents = {};
  const inDegree = {};

  nodes.forEach(n => {
    children[n.id] = [];
    parents[n.id] = [];
    inDegree[n.id] = 0;
  });

  edges.forEach(e => {
    if (nodeIds.has(e.from) && nodeIds.has(e.to)) {
      children[e.from].push(e.to);
      parents[e.to].push(e.from);
      inDegree[e.to]++;
    }
  });

  // Longest-path layering via Kahn's algorithm
  const levels = {};
  const queue = [];
  nodes.forEach(n => {
    if (inDegree[n.id] === 0) {
      queue.push(n.id);
      levels[n.id] = 0;
    }
  });

  // If no roots (shouldn't happen with valid DAG, but handle cycles)
  if (queue.length === 0 && nodes.length > 0) {
    queue.push(nodes[0].id);
    levels[nodes[0].id] = 0;
    inDegree[nodes[0].id] = 0;
  }

  const processed = new Set();
  while (queue.length > 0) {
    const id = queue.shift();
    processed.add(id);
    const currentLevel = levels[id];
    children[id].forEach(child => {
      inDegree[child]--;
      levels[child] = Math.max(levels[child] !== undefined ? levels[child] : 0, currentLevel + 1);
      if (inDegree[child] === 0) {
        queue.push(child);
      }
    });
  }

  // Handle any unprocessed nodes (cycles or disconnected)
  nodes.forEach(n => {
    if (!processed.has(n.id)) {
      levels[n.id] = levels[n.id] !== undefined ? levels[n.id] : 0;
    }
  });

  // Group by level
  const levelMap = {};
  nodes.forEach(n => {
    const lv = levels[n.id];
    if (!levelMap[lv]) levelMap[lv] = [];
    levelMap[lv].push(n.id);
  });

  // Assign positions
  const positions = {};
  const spacingX = 260;
  const spacingY = 180;
  const levelKeys = Object.keys(levelMap).map(Number).sort((a, b) => a - b);

  levelKeys.forEach(lv => {
    const ids = levelMap[lv];
    const count = ids.length;
    ids.forEach((id, idx) => {
      positions[id] = {
        x: (idx - (count - 1) / 2) * spacingX,
        y: lv * spacingY
      };
    });
  });

  return positions;
}

// ===== EXPLODE =====
async function explodeDiagram(code) {
  setStatus('Parsing Mermaid code...');
  const parsed = parseMermaid(code);
  state.classDefs = parsed.classDefs;

  if (parsed.nodes.length === 0) {
    setStatus('No nodes found in diagram');
    return;
  }

  clearAll();

  setStatus('Computing layout...');
  const positions = computeLayout(parsed.nodes, parsed.edges);

  // Debug: verify positions are spread out
  const xs = Object.values(positions).map(p => p.x);
  const ys = Object.values(positions).map(p => p.y);
  console.log('Layout range — x:', Math.min(...xs), 'to', Math.max(...xs), '| y:', Math.min(...ys), 'to', Math.max(...ys));

  // Center the diagram
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  parsed.nodes.forEach(n => {
    const pos = positions[n.id];
    minX = Math.min(minX, pos.x - 80);
    minY = Math.min(minY, pos.y - 30);
    maxX = Math.max(maxX, pos.x + 80);
    maxY = Math.max(maxY, pos.y + 30);
  });

  const centerX = (minX + maxX) / 2;
  const centerY = (minY + maxY) / 2;

  // Build map from node ID to pin ID for connections
  const nodeIdToPinId = {};

  parsed.nodes.forEach(n => {
    const pos = positions[n.id];
    const style = n.className && state.classDefs[n.className]
      ? state.classDefs[n.className]
      : {};
    const pin = createPin(pos.x - centerX, pos.y - centerY, n.label, style, n.shape);
    nodeIdToPinId[n.id] = pin.id;
  });

  // Create connections
  parsed.edges.forEach(e => {
    const fromPinId = nodeIdToPinId[e.from];
    const toPinId = nodeIdToPinId[e.to];
    if (fromPinId && toPinId) {
      addConnection(fromPinId, toPinId, e.label);
    }
  });

  // Auto-zoom to fit
  const vpW = viewport.clientWidth;
  const vpH = viewport.clientHeight;
  const diagW = maxX - minX + 200;
  const diagH = maxY - minY + 150;
  const fitZoom = Math.min(vpW / diagW, vpH / diagH, 1.5);
  state.camera.zoom = Math.max(0.2, Math.min(fitZoom, 2));
  state.camera.x = vpW / 2;
  state.camera.y = vpH / 2;
  updateCamera();

  setStatus(`Exploded ${parsed.nodes.length} nodes, ${parsed.edges.length} edges`);
}

// ===== STATUS =====
function setStatus(msg) {
  statusEl.textContent = msg;
}

// ===== EVENT LISTENERS =====
document.getElementById('btn-add-note').addEventListener('click', () => {
  const w = screenToWorld(viewport.clientWidth / 2, viewport.clientHeight / 2);
  createPin(w.x - 70, w.y - 30, 'New Note', { fill: '#fff9c4' }, 'rect');
  setStatus('Note added');
});

document.getElementById('btn-explode').addEventListener('click', () => {
  mermaidInput.value = defaultMermaid;
  modalOverlay.classList.add('open');
});

document.getElementById('btn-clear').addEventListener('click', () => {
  if (confirm('Clear all pins and connections?')) clearAll();
});

document.getElementById('btn-cancel').addEventListener('click', () => {
  modalOverlay.classList.remove('open');
});

document.getElementById('btn-render').addEventListener('click', async () => {
  const code = mermaidInput.value.trim();
  if (!code) return;
  modalOverlay.classList.remove('open');
  await explodeDiagram(code);
});

modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) modalOverlay.classList.remove('open');
});

// Viewport pan
viewport.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  if (e.target.closest('.pin')) return;
  state.panning = true;
  state.panStart = { x: e.clientX, y: e.clientY };
  state.cameraStart = { ...state.camera };
  viewport.classList.add('grabbing');
});

window.addEventListener('mousemove', (e) => {
  if (state.panning) {
    const dx = e.clientX - state.panStart.x;
    const dy = e.clientY - state.panStart.y;
    state.camera.x = state.cameraStart.x + dx;
    state.camera.y = state.cameraStart.y + dy;
    updateCamera();
  }
  if (state.dragging) {
    const w = screenToWorld(e.clientX, e.clientY);
    state.dragging.x = w.x - state.dragOffset.x;
    state.dragging.y = w.y - state.dragOffset.y;
    state.dragging.el.style.left = state.dragging.x + 'px';
    state.dragging.el.style.top = state.dragging.y + 'px';
    renderConnections();
  }
});

window.addEventListener('mouseup', () => {
  if (state.panning) {
    state.panning = false;
    viewport.classList.remove('grabbing');
  }
  if (state.dragging) {
    state.dragging.el.classList.remove('dragging');
    state.dragging = null;
  }
});

// Zoom with wheel centered on cursor
viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
  const newZoom = Math.max(0.1, Math.min(5, state.camera.zoom * zoomFactor));

  const mouseWorldBefore = screenToWorld(e.clientX, e.clientY);
  state.camera.zoom = newZoom;
  const mouseWorldAfter = screenToWorld(e.clientX, e.clientY);

  state.camera.x += (mouseWorldAfter.x - mouseWorldBefore.x) * newZoom;
  state.camera.y += (mouseWorldAfter.y - mouseWorldBefore.y) * newZoom;

  updateCamera();
}, { passive: false });

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    modalOverlay.classList.remove('open');
  }
});

// ===== INIT =====
updateCamera();
setStatus('Loading default diagram...');
explodeDiagram(defaultMermaid);
</script>
